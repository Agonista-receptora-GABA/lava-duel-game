apiVersion: apps/v1
kind: Deployment
metadata:
  name: lava-duel-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lava-duel-redis
  template:
    metadata:
      labels:
        app: lava-duel-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: lava-duel-redis
spec:
  selector:
    app: lava-duel-redis
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
  type: ClusterIP
