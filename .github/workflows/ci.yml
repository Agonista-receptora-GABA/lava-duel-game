name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Used by the server tests (tests/server) instead of spawning a local redis-server
      TEST_REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Type-check (frontend, server build, tests)
        run: |
          npm run type-check
          npm run build:server
          npm run type-check:tests

      - name: Tests (unit + server)
        run: npm test

      - name: Build and smoke-test the production server
        run: |
          npm run build
          npm run smoke
